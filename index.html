<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Stone Age — Tiny Wild World</title>
<style>
:root{--ink:#30251e;--paper:#fff8e9;--line:#e7d5b8}
*{box-sizing:border-box}
body{margin:0;background:#f5ead5;color:var(--ink);font:15px/1.45 system-ui,-apple-system,Segoe UI,sans-serif}
header{padding:20px clamp(16px,4vw,42px) 12px}
.brand{font-size:12px;font-weight:900;letter-spacing:.18em;text-transform:uppercase;color:#8b5b3c}
h1{font-size:clamp(28px,5vw,46px);line-height:1;margin:8px 0 5px;letter-spacing:-.045em}
.sub{margin:0;color:#7c6855}
main{max-width:1100px;margin:auto;padding:0 clamp(12px,3vw,34px) 30px}
.panel{background:var(--paper);border:1px solid var(--line);border-radius:22px;overflow:hidden;box-shadow:0 10px 30px #6243220b}
.top{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;border-bottom:1px solid var(--line);gap:10px;flex-wrap:wrap}
.eyebrow{font-size:11px;font-weight:900;letter-spacing:.13em;text-transform:uppercase;color:#9b6a45}
.pill{font-size:12px;background:#f1e3c9;border-radius:999px;padding:6px 12px;color:#71583f}
canvas{display:block;width:100%;height:auto;aspect-ratio:900/560;background:#bde0d8}
.controls{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;padding:14px 16px;border-top:1px solid var(--line)}
button{border:0;border-radius:14px;background:var(--ink);color:#fff8e9;font:700 14px system-ui;padding:14px 10px;cursor:pointer;transition:transform .12s,opacity .12s}
button:hover{transform:translateY(-2px)}
button.on{outline:3px solid #d97745}
#bThunder{background:#4a4568}#bRain{background:#3f7ea8}#bFlood{background:#2f8f98}#bQuake{background:#8b5b3c}
@media(max-width:560px){.controls{grid-template-columns:1fr 1fr}}
footer{text-align:center;color:#9a8064;font-size:12px;padding:0 18px 24px}
</style>
</head>
<body>
<header>
 <div class="brand">🪨 STONE AGE / tiny wild world</div>
 <h1>Seven little weirdos.</h1>
 <p class="sub">A tiny tribe: fishing, elections, visitors, and completely unhinged disasters.</p>
</header>
<main>
<section class="panel">
 <div class="top"><div><div class="eyebrow">Live simulation</div><strong id="caption">A suspiciously peaceful afternoon</strong></div><div class="pill" id="weather">☀️ Sunny-ish</div></div>
 <canvas id="world" width="900" height="560" aria-label="Animated prehistoric world with seven characters"></canvas>
 <div class="controls">
  <button id="bThunder">⚡ Thunder</button>
  <button id="bRain">🌧️ Rain</button>
  <button id="bFlood">🌊 Flood</button>
  <button id="bQuake">🫨 Earthquake</button>
 </div>
</section>
</main>
<footer>A tiny prehistoric sandbox. Nobody asked the rocks.</footer>
<script>
const canvas=document.getElementById("world"),ctx=canvas.getContext("2d");
const $=id=>document.getElementById(id);
const rnd=(a,b)=>a+Math.random()*(b-a);
const DOOR={x:410,y:350};
const people=[
 {name:"Brog",g:"m",skin:"#b96e43",hair:"#33241d",x:125,y:365},
 {name:"Gronk",g:"m",skin:"#d89b68",hair:"#493126",x:225,y:395},
 {name:"Ugg",g:"m",skin:"#8c543b",hair:"#211a17",x:325,y:380},
 {name:"Thag",g:"m",skin:"#c77d4c",hair:"#38271e",x:470,y:405},
 {name:"Mira",g:"f",skin:"#d9a077",hair:"#30221d",x:540,y:375},
 {name:"Luma",g:"f",skin:"#ad6947",hair:"#3b251c",x:640,y:398},
 {name:"Nima",g:"f",skin:"#e1ad7d",hair:"#4a3025",x:730,y:375}
];
people.forEach((p,i)=>{p.phase=i*.9+.3;p.tx=p.x;p.ty=p.y;p.act="chat";p.timer=rnd(1,4);p.inside=false;p.carry=null;p.carriedBy=null;p.face=1});
const IDLE=["walk","walk","chat","laugh","fish","plant","eat","sleep","dance","sing"];
const IDLE_TXT={walk:"👣",chat:"💬",laugh:"😂",fish:"🎣",plant:"🌱",eat:"🍎",sleep:"💤",dance:"🎵",sing:"🎶"};
let weather="none",wTime=0,flash=0,nextBolt=0,bolts=[],drops=[],flood=0,shake=0;
for(let i=0;i<160;i++)drops.push({x:rnd(0,900),y:rnd(0,560),s:rnd(420,620)});
const CAPTIONS={
 none:["A suspiciously peaceful afternoon","Everyone is doing something. Nobody knows what.","The tribe is thriving? Maybe."],
 thunder:"BOOM! Everyone is shocked and running indoors",
 rain:"Rain! The tribe has decided to dance about it",
 flood:"FLOOD! Run run run run run",
 quake:"Earthquake! Carry your friend and panic"
};
const names={none:"☀️ Sunny-ish",thunder:"⚡ Thunderstorm",rain:"🌧️ Rain",flood:"🌊 Flood",quake:"🫨 Earthquake"};

function setWeather(w){
 // let anyone inside come out first
 people.forEach(p=>{if(p.inside){p.inside=false;p.x=DOOR.x;p.y=DOOR.y+25}p.carry=null;p.carriedBy=null});
 weather=w;wTime=0;nextBolt=0;
 document.querySelectorAll(".controls button").forEach(b=>b.classList.remove("on"));
 const map={thunder:"bThunder",rain:"bRain",flood:"bFlood",quake:"bQuake"};
 if(map[w])$(map[w]).classList.add("on");
 $("weather").textContent=names[w];
 $("caption").textContent=Array.isArray(CAPTIONS[w])?CAPTIONS[w][0]:CAPTIONS[w];
 if(w==="quake"){
  const order=people.map((_,i)=>i).filter(i=>!people[i].dead).sort(()=>Math.random()-.5);
  for(let i=0;i+1<order.length;i+=2){const a=people[order[i]],b=people[order[i+1]];a.carry=b;b.carriedBy=a}
 }
 if(w==="flood")people.forEach(p=>{p.tx=rnd(30,870);p.ty=rnd(350,420);p.timer=rnd(.4,1)});
 if(w==="thunder")people.forEach((p,i)=>{p.tx=DOOR.x+rnd(-6,6);p.ty=DOOR.y+25;p.delay=i*.12});
}
$("bThunder").onclick=()=>setWeather("thunder");
$("bRain").onclick=()=>setWeather("rain");
$("bFlood").onclick=()=>setWeather("flood");
$("bQuake").onclick=()=>setWeather("quake");

function move(p,dt,speed){
 const dx=p.tx-p.x,dy=p.ty-p.y,d=Math.hypot(dx,dy);
 if(d<3)return false;
 const s=Math.min(d,speed*dt);p.x+=dx/d*s;p.y+=dy/d*s;if(Math.abs(dx)>1)p.face=dx>0?1:-1;return true;
}
function pickIdle(p){
 p.act=IDLE[Math.floor(Math.random()*IDLE.length)];p.timer=rnd(2.5,6);
 if(p.act==="walk"){p.tx=rnd(40,860);p.ty=rnd(360,425)}
 if(p.act==="fish"){p.tx=rnd(60,840);p.ty=rnd(418,432)}
}
function update(dt,t){
 wTime+=dt;sceneTick(dt,t);
 if(weather!=="none"&&wTime>(weather==="flood"?11:9)){
  setWeather("none");
  people.forEach(p=>{p.timer=rnd(.5,2);p.act="walk";p.tx=rnd(150,750);p.ty=rnd(365,420)});
 }
 // weather fx
 if(weather==="thunder"){
  nextBolt-=dt;if(nextBolt<=0){nextBolt=rnd(.9,1.8);flash=1;const x=rnd(120,780);let pts=[[x,0]],y=0,cx=x;while(y<340){y+=rnd(30,55);cx+=rnd(-35,35);pts.push([cx,y])}bolts=[{pts,life:.25}]}
 }
 flash=Math.max(0,flash-dt*2.2);bolts.forEach(b=>b.life-=dt);bolts=bolts.filter(b=>b.life>0);
 if(weather==="rain"||weather==="thunder"||weather==="flood")drops.forEach(d=>{d.y+=d.s*dt;d.x-=60*dt;if(d.y>560){d.y=-10;d.x=rnd(0,960)}});
 const fl=weather==="flood"?Math.min(1,wTime/3)*(wTime>8?Math.max(0,1-(wTime-8)/3):1):0;
 flood+=(fl-flood)*Math.min(1,dt*4);
 shake=Math.max(weather==="quake"?(wTime<8.2?1:Math.max(0,1-(wTime-8.2)/.8)):0,sceneShake);

 people.forEach((p,i)=>{
  if(p.dead){p.respawn-=dt;if(p.respawn<=0){p.dead=false;p.x=75;p.y=262;p.act="walk";p.tx=rnd(160,700);p.ty=rnd(365,420);p.timer=4;p.emo=null;p.scare=0;parts.push({type:"txt",s:p.name+" is back!",size:13,x:75,y:222,vy:-15,life:2.2,max:2.2})}return}
  if(p.carriedBy){p.x=p.carriedBy.x;p.y=p.carriedBy.y;return}
  if(nightMode && weather==="none" && i%2===0 && !p.inside){p.act="sleep";p.emo="💤";p.tx=p.x;p.ty=p.y;return}
  if(weather==="thunder"){
   if(p.delay>0){p.delay-=dt;p.act="shock";return}
   if(p.inside)return;
   p.act="shock";
   if(!move(p,dt,190)){p.inside=true}
   return;
  }
  if(weather==="flood"){
   p.act="run";p.timer-=dt;
   if(p.timer<=0||!move(p,dt,230)){p.tx=rnd(30,870);p.ty=rnd(345,425);p.timer=rnd(.6,1.5)}
   else move(p,0,0);
   return;
  }
  if(weather==="quake"){
   if(p.carry){p.act="carry";p.timer-=dt;if(p.timer<=0){p.tx=Math.max(40,Math.min(860,p.x+rnd(-90,90)));p.ty=rnd(365,415);p.timer=rnd(.5,1.2)}move(p,dt,70)}
   else{p.act="panic";p.timer-=dt;if(p.timer<=0){p.tx=rnd(40,860);p.ty=rnd(365,415);p.timer=rnd(.3,.8)}move(p,dt,120)}
   return;
  }
  if(weather==="rain"){
   p.act="dance";p.timer-=dt;if(p.timer<=0){p.tx=Math.max(40,Math.min(860,p.x+rnd(-70,70)));p.ty=rnd(365,420);p.timer=rnd(1,2.5)}move(p,dt,45);return;
  }
  if(p.scare>0){p.scare-=dt;p.act="panic";p.timer-=dt;if(p.timer<=0||!move(p,dt,130)){p.tx=rnd(40,860);p.ty=rnd(365,425);p.timer=rnd(.4,.9)}return}
  // normal: random things
  p.timer-=dt;if(p.timer<=0)pickIdle(p);
  if(p.act==="walk"||p.act==="fish"){if(!move(p,dt,55)&&p.act==="walk")p.timer=Math.min(p.timer,.2)}
 });
 // random caption rotation in calm weather
 if(weather==="none"&&!scenes.length&&Math.floor(t/7)!==update.lastCap){update.lastCap=Math.floor(t/7);const c=CAPTIONS.none;$("caption").textContent=c[update.lastCap%c.length]}
}

// ---------- random scenes ----------
let scenes=[],parts=[],sceneClock=5,lastScene=-1,sceneShake=0,extraDark=0;
let electionClock=420,flyerClock=540,flyerActive=0;
// World cycles: day/night every 4 minutes, village every 5 minutes, flyer every 3 minutes.
let worldVillage="river", nightMode=false, lastDayNightCycle=-1, lastVillageCycle=0, lastFlyerCycle=0, flyerStart=-999;
function updateWorldCycles(t){
 const cycle=Math.floor(t/240);
 if(cycle!==lastDayNightCycle){
  lastDayNightCycle=cycle; nightMode=(cycle%2===1);
  if(nightMode){people.forEach(p=>{if(!p.dead&&!p.inside&&!p.carriedBy){p.act="sleep";p.emo="💤";p.tx=p.x;p.ty=p.y;}});$("caption").textContent="🌙 Night falls. The tribe sleeps on the sand.";}
  else {people.forEach(p=>{if(!p.dead&&!p.inside&&!p.carriedBy){p.emo=null;p.act="walk";p.timer=1;p.tx=rnd(40,860);p.ty=rnd(365,425);}});$("caption").textContent="☀️ Sunrise! The tribe wakes up.";}
 }
 const villageCycle=Math.floor(t/300);
 if(villageCycle!==lastVillageCycle){lastVillageCycle=villageCycle;worldVillage=(villageCycle%2===1)?"forest":"river";$("caption").textContent=worldVillage==="forest"?"🌲 The tribe has moved to a deep forest village with a pyramid!":"🏞️ The tribe returns to the riverside village.";}
 const flyerCycle=Math.floor(t/180);
 if(flyerCycle!==lastFlyerCycle){lastFlyerCycle=flyerCycle;flyerStart=t;}
 flyerActive=(t-flyerStart>=0&&t-flyerStart<22)?1:0;
}
function drawFlyingMan(t){
 if(!flyerActive)return;
 const elapsed=t-flyerStart, x=-80+(980*(elapsed/22)), y=115+Math.sin(elapsed*1.5)*22;
 ctx.save();ctx.translate(x,y);ctx.rotate(Math.sin(elapsed*2)*.05);
 // A harmless person gliding horizontally under a large orange sheet.
 ctx.fillStyle="#f58225";ctx.beginPath();ctx.moveTo(-8,-10);ctx.quadraticCurveTo(-75,-55,-120,-18);ctx.quadraticCurveTo(-70,-6,-12,5);ctx.closePath();ctx.fill();
 ctx.strokeStyle="#594331";ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(-12,0);ctx.lineTo(-2,22);ctx.lineTo(16,28);ctx.moveTo(-2,22);ctx.lineTo(-20,30);ctx.moveTo(-8,7);ctx.lineTo(-26,17);ctx.moveTo(-8,7);ctx.lineTo(9,15);ctx.stroke();
 ctx.fillStyle="#b96e43";ctx.beginPath();ctx.arc(-7,-5,8,0,Math.PI*2);ctx.fill();ctx.fillStyle="#33241d";ctx.beginPath();ctx.arc(-9,-9,8,Math.PI,Math.PI*2);ctx.fill();ctx.restore();
}
const sun={x:760,y:80,on:true,crack:0};
const bump=v=>{sceneShake=Math.max(sceneShake,v)};
const alive=()=>people.filter(p=>!p.dead&&!p.inside&&!p.carriedBy&&!p.carry);
const pickAlive=()=>{const a=alive();return a.length?a[Math.floor(Math.random()*a.length)]:null};
const two=()=>{const a=alive().sort(()=>Math.random()-.5);return a.length>=2?[a[0],a[1]]:null};
const scareAll=s=>people.forEach(p=>{if(!p.dead&&!p.inside)p.scare=s+Math.random()*.6});
function boom(x,y,r=90){parts.push({type:"ring",x,y,life:.8,max:.8,r},{type:"txt",s:"💥",size:44,x,y:y-10,vy:-30,life:.8,max:.8})}
function pop(p){parts.push({type:"head",x:p.x,y:p.y-24,vx:rnd(-120,120),vy:-300,g:700,life:1.5,max:1.5,skin:p.skin,hair:p.hair})}
function kill(p){
 if(!p||p.dead||p.inside)return;
 if(p.carry){p.carry.carriedBy=null;p.carry=null}
 if(p.carriedBy){p.carriedBy.carry=null;p.carriedBy=null}
 p.dead=true;p.respawn=9;p.emo=null;
 parts.push({type:"txt",s:"👻",size:34,x:p.x,y:p.y-10,vy:-45,life:2.2,max:2.2});
 for(let i=0;i<5;i++)parts.push({type:"txt",s:"✨",size:16,x:p.x,y:p.y-10,vx:rnd(-70,70),vy:rnd(-110,-30),g:120,life:1,max:1});
}
function fireball(x,y,r){
 const g=ctx.createRadialGradient(x,y,2,x,y,r);g.addColorStop(0,"#fff3a0");g.addColorStop(.5,"#ff9a2e");g.addColorStop(1,"#e4452e00");
 ctx.fillStyle=g;ctx.beginPath();ctx.arc(x,y,r,0,7);ctx.fill();
 ctx.strokeStyle="#ff8a3a99";ctx.lineWidth=r*.7;ctx.lineCap="round";ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x-r*4,y-r*7);ctx.stroke();
}
function drawSun(t){
 if(!sun.on)return;const r=36;
 if(sun.crack>0){const g=ctx.createRadialGradient(sun.x,sun.y,r,sun.x,sun.y,r*1.8);g.addColorStop(0,"#ffb04a88");g.addColorStop(1,"#ffb04a00");ctx.fillStyle=g;ctx.beginPath();ctx.arc(sun.x,sun.y,r*1.8,0,7);ctx.fill()}
 ctx.fillStyle=sun.crack>.8?"#ff9a3a":"#fff2ad";ctx.beginPath();ctx.arc(sun.x,sun.y,r,0,7);ctx.fill();
 if(sun.crack>0){
  ctx.strokeStyle="#6b2a12";ctx.lineWidth=2.5;ctx.beginPath();
  const seg=[[-30,-10,-8,-4,4,-14,26,-6],[-20,26,-8,8,6,10,18,30],[0,-36,-4,-18,8,-4,2,12],[-34,10,-14,12,-6,22,6,36],[30,10,12,6,10,-4,30,-24]];
  const L=Math.ceil(sun.crack*5);
  for(let i=0;i<L;i++){const s=seg[i];ctx.moveTo(sun.x+s[0],sun.y+s[1]);for(let j=2;j<8;j+=2)ctx.lineTo(sun.x+s[j],sun.y+s[j+1])}
  ctx.stroke();
 }
}
function drawTitan(x,y,t){
 ctx.save();ctx.translate(x,y);ctx.scale(1.7,1.7);const w=Math.sin(t*3)*2;
 ctx.fillStyle="#5d6e45";
 ctx.beginPath();ctx.moveTo(-30,-60);ctx.quadraticCurveTo(-120,-40+w*3,-150,-100);ctx.lineTo(-120,-95);ctx.quadraticCurveTo(-90,-70,-20,-95);ctx.fill();
 ctx.beginPath();ctx.ellipse(0,-95,48,62,0,0,7);ctx.fill();
 ctx.fillStyle="#7d8f5a";ctx.beginPath();ctx.ellipse(8,-80,28,42,0,0,7);ctx.fill();
 ctx.fillStyle="#5d6e45";ctx.fillRect(-35,-50,24,50);ctx.fillRect(12,-50,24,50);ctx.fillRect(-42,-6,36,10);ctx.fillRect(10,-6,40,10);
 ctx.beginPath();ctx.ellipse(38,-148,34,26,.1,0,7);ctx.fill();
 ctx.fillStyle="#f6e7c4";for(let i=0;i<5;i++){ctx.beginPath();ctx.moveTo(30+i*8,-132);ctx.lineTo(34+i*8,-122);ctx.lineTo(38+i*8,-132);ctx.fill()}
 ctx.fillStyle="#d8c18a";ctx.beginPath();ctx.moveTo(18,-168);ctx.lineTo(10,-190);ctx.lineTo(28,-172);ctx.fill();ctx.beginPath();ctx.moveTo(40,-172);ctx.lineTo(40,-196);ctx.lineTo(52,-170);ctx.fill();
 ctx.fillStyle="#fff3a0";ctx.beginPath();ctx.arc(52,-154,5,0,7);ctx.fill();ctx.fillStyle="#222";ctx.beginPath();ctx.arc(53,-154,2.5,0,7);ctx.fill();
 ctx.fillStyle="#5d6e45";ctx.fillRect(28,-110,22,8);ctx.fillRect(40,-120,12,6);
 ctx.restore();
}
const bigEmoji=(s,x,y,size,rot=0,flip=1)=>{ctx.save();ctx.translate(x,y);ctx.rotate(rot);ctx.scale(flip,1);ctx.font=size+"px system-ui";ctx.textAlign="center";ctx.fillText(s,0,size*.35);ctx.restore()};
const freeze=v=>{if(v){v.act="shock";v.timer=7}};

const SCENES=[
["meteor","☄️ A meteor falls!",()=>{scareAll(3);const gx=rnd(150,800),gy=rnd(375,430);let hit=0;return{dur:4,
 upd(dt,t){if(!hit&&t>1.6){hit=1;bump(1.2);flash=.8;boom(gx,gy);alive().forEach(p=>{if(Math.hypot(p.x-gx,(p.y-gy)*1.5)<55)kill(p)})}},
 drw(t){if(t<1.6){const k=t/1.6;fireball(gx-320*(1-k),gy-520*(1-k),24)}}}}],
["meteors","☄️☄️ Meteor shower!",()=>{scareAll(5);const ms=[...Array(7)].map((_,i)=>({t0:i*.55,gx:rnd(60,840),gy:rnd(370,440),hit:0}));return{dur:6,
 upd(dt,t){ms.forEach(m=>{if(!m.hit&&t>m.t0+1.3){m.hit=1;bump(.8);boom(m.gx,m.gy,60);alive().forEach(p=>{if(Math.hypot(p.x-m.gx,(p.y-m.gy)*1.5)<40)kill(p)})}})},
 drw(t){ms.forEach(m=>{const u=(t-m.t0)/1.3;if(u>0&&u<1)fireball(m.gx-260*(1-u),m.gy-480*(1-u),16)})}}}],
["moon","🌕 The moon is falling!",()=>{scareAll(8);let hit=0;return{dur:10,
 upd(dt,t){if(!hit&&t>5){hit=1;bump(2.5);flash=1;boom(450,380,200)}},
 drw(t){let y,r,a=1;if(t<5){const k=t/5;y=-100+k*k*440;r=50+k*130}else{const k=Math.min(1,(t-5)/4);y=340-k*480;r=180-k*110;a=1-k*.6}
  ctx.globalAlpha=Math.max(0,a);ctx.fillStyle="#f3efd8";ctx.beginPath();ctx.arc(450,y,r,0,7);ctx.fill();
  ctx.fillStyle="#d6d0b4";[[-.3,-.2,.18],[.25,.1,.22],[-.1,.4,.12],[.4,-.35,.1]].forEach(c=>{ctx.beginPath();ctx.arc(450+c[0]*r,y+c[1]*r,c[2]*r,0,7);ctx.fill()});ctx.globalAlpha=1}}}],
["shark","🦈 A giant shark comes onto land!",()=>{scareAll(1);const v=pickAlive();freeze(v);const vx=v?v.x:450,vy=v?v.y:400;let hit=0;return{dur:7.5,
 upd(dt,t){if(!hit&&t>1.7){hit=1;bump(1);boom(vx,vy+20,70);kill(v)}},
 drw(t){let x,y,rot=0;if(t<1.7){const k=t/1.7;x=-100+(vx+100)*k;y=440-150*Math.sin(Math.PI*k);rot=.5-k*1.1}else if(t<5){x=vx;y=vy+5;rot=Math.sin(t*14)*.35}else{const k=(t-5)/2.5;x=vx+(1000-vx)*k;y=vy+(445-vy)*k;rot=Math.sin(t*10)*.2}
  bigEmoji("🦈",x,y,120,rot,-1);if(t>1.7&&t<5)label("CHOMP!",vx,vy-70,22,"#b02f1d")}}}],
["titan","🦖 Something huge rises from underground!",()=>{scareAll(6);const v=pickAlive();freeze(v);const gx=Math.max(120,Math.min(780,(v?v.x:450)-40));let hit=0;return{dur:8,
 upd(dt,t){if(!hit&&t>3){hit=1;bump(2);alive().forEach(p=>{if(Math.abs(p.x-(gx+40))<70)kill(p)});kill(v)}
  if(t<2&&Math.random()<dt*20)parts.push({type:"txt",s:"💨",size:22,x:gx+rnd(-80,80),y:395,vy:-30,life:.8,max:.8})},
 drw(t){const rise=t<2?(1-t/2):t>6.5?(t-6.5)/1.5:0;drawTitan(gx,430+rise*270,t);if(t>2.2&&t<4)label("ROOOAAARR!",gx,150,30,"#7a1f12")}}}],

   else if(st===1&&t>tt+.6){st=2;bump(.5);if(withHead){pop(B);A.emo="😈"}else{A.emo="😋";parts.push({type:"txt",s:"NOM NOM",size:22,x:B.x,y:B.y-60,vy:-25,life:1.5,max:1.5})}kill(B);A.act=withHead?"laugh":"eat";A.timer=4}
  },
  drw(t){if(st===1){const sw=Math.sin((t-tt)*16);ctx.save();ctx.translate(A.x+A.face*28,A.y-10);ctx.rotate(A.face*sw*.9);ctx.font="34px system-ui";ctx.textAlign="center";ctx.fillStyle="#30251e";ctx.fillText(withHead?"🪓":"🦷",0,0);ctx.restore()}},
  end(){A.emo=null;A.timer=1}};
};
SCENES.push(["axe","😈 A villager snaps and swings an axe!",villagerScene(true)],["eat","😋 A hungry villager has a snack...",villagerScene(false)]);

function sceneTick(dt,t){
 sceneShake=Math.max(0,sceneShake-dt*1.1);
 sceneClock-=dt;
 if(sceneClock<=0){
  sceneClock=14;let i;do{i=Math.floor(Math.random()*SCENES.length)}while(i===lastScene);
  lastScene=i;const sc=SCENES[i][2]();sc.t=0;scenes.push(sc);
  $("caption").textContent=SCENES[i][1];$("weather").textContent="🎬 Random scene";
 }
 const before=scenes.length;
 scenes.forEach(s=>{s.t+=dt;s.upd&&s.upd(dt,s.t)});

 parts.forEach(q=>{q.life-=dt;q.x+=(q.vx||0)*dt;q.y+=(q.vy||0)*dt;q.vy=(q.vy||0)+(q.g||0)*dt});

  ctx.globalAlpha=1;
 });
}

function drawPerson(p,t,x,y,mode){
 // mode: act string
 const jump=["dance","sing","laugh","panic","carry"].includes(mode);
 const bob=mode==="dance"?Math.abs(Math.sin(t*6+p.phase))*14:mode==="panic"?Math.abs(Math.sin(t*14+p.phase))*8:mode==="shock"?Math.abs(Math.sin(t*18))*4:(mode==="laugh"||mode==="sing")?Math.abs(Math.sin(t*5+p.phase))*8:mode==="sleep"?0:Math.sin(t*2+p.phase)*2;
 const yy=y-bob;
 ctx.fillStyle="#4b7559";ctx.globalAlpha=.16;ctx.beginPath();ctx.ellipse(x,y+38,25,7,0,0,7);ctx.fill();ctx.globalAlpha=1;
 ctx.save();ctx.translate(x,yy);
 if(mode==="sleep"){ctx.rotate(-.12)}
 if(mode==="dance")ctx.rotate(Math.sin(t*6+p.phase)*.12);
 if(mode==="panic"||mode==="shock")ctx.translate(Math.sin(t*40+p.phase)*2,0);
 if(mode==="run")ctx.rotate(.18*p.face);
 const fast=mode==="run"?14:mode==="walk"?6:mode==="panic"?18:mode==="carry"?9:mode==="dance"?8:0;
 const stride=fast?Math.sin(t*fast+p.phase)*(mode==="run"?14:10):0;
 ctx.strokeStyle="#75412e";ctx.lineWidth=10;ctx.lineCap="round";
 ctx.beginPath();ctx.moveTo(-7,18);ctx.lineTo(-10+stride,37);ctx.moveTo(7,18);ctx.lineTo(10-stride,37);ctx.stroke();
 ctx.fillStyle=p.g==="f"?"#a8a55d":"#98704a";ctx.beginPath();ctx.moveTo(-17,-5);ctx.lineTo(17,-5);ctx.lineTo(20,22);ctx.lineTo(-20,22);ctx.closePath();ctx.fill();
 // arms
 ctx.strokeStyle=p.skin;ctx.lineWidth=8;ctx.beginPath();
 const up=["dance","sing","shock","panic","carry"].includes(mode);
 if(mode==="run"){const a=Math.sin(t*14+p.phase)*14;ctx.moveTo(-14,0);ctx.lineTo(-24,6+a);ctx.moveTo(14,0);ctx.lineTo(24,6-a)}
 else if(mode==="dance"){const a=Math.sin(t*6+p.phase)*10;ctx.moveTo(-14,0);ctx.lineTo(-27,-22+a);ctx.moveTo(14,0);ctx.lineTo(27,-22-a)}
 else if(mode==="carry"){ctx.moveTo(-14,0);ctx.lineTo(-18,-22);ctx.moveTo(14,0);ctx.lineTo(18,-22)}
 else if(up){ctx.moveTo(-14,0);ctx.lineTo(-26,-24);ctx.moveTo(14,0);ctx.lineTo(26,-24)}
 else if(mode==="fish"){ctx.moveTo(-14,0);ctx.lineTo(-24,8);ctx.moveTo(14,0);ctx.lineTo(28,-6)}
 else if(mode==="eat"){ctx.moveTo(-14,0);ctx.lineTo(-29,12);ctx.moveTo(14,0);ctx.lineTo(10,-16)}
 else {ctx.moveTo(-14,0);ctx.lineTo(-29,12);ctx.moveTo(14,0);ctx.lineTo(29,12)}
 ctx.stroke();
 if(mode==="fish"){ctx.strokeStyle="#6b4a2f";ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(28,-6);ctx.lineTo(55,-38);ctx.stroke();ctx.strokeStyle="#fff8";ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(55,-38);ctx.lineTo(55,22+Math.sin(t*3)*3);ctx.stroke()}
 // head
 ctx.fillStyle=p.skin;ctx.beginPath();ctx.arc(0,-20,17,0,7);ctx.fill();
 ctx.fillStyle=p.hair;ctx.beginPath();ctx.arc(0,-26,17,Math.PI,Math.PI*2);ctx.lineTo(16,-18);ctx.quadraticCurveTo(8,-22,5,-17);ctx.lineTo(-16,-18);ctx.closePath();ctx.fill();
 if(p.g==="f"){ctx.beginPath();ctx.arc(-15,-17,7,0,7);ctx.arc(15,-17,7,0,7);ctx.fill();ctx.fillStyle="#e86f8a";ctx.beginPath();ctx.arc(-9,-37,4,0,7);ctx.fill()}
 // face
 const scared=["shock","run","panic"].includes(mode);
 ctx.fillStyle="#fff";
 if(scared){ctx.beginPath();ctx.arc(-6,-21,4,0,7);ctx.arc(6,-21,4,0,7);ctx.fill()}
 ctx.fillStyle="#2b211b";ctx.beginPath();
 if(mode==="sleep"){ctx.strokeStyle="#2b211b";ctx.lineWidth=1.6;ctx.beginPath();ctx.moveTo(-9,-20);ctx.lineTo(-3,-20);ctx.moveTo(3,-20);ctx.lineTo(9,-20);ctx.stroke()}
 else ctx.arc(-6,-21,scared?1.4:1.8,0,7),ctx.arc(6,-21,scared?1.4:1.8,0,7),ctx.fill();
 ctx.strokeStyle="#633b2c";ctx.lineWidth=1.7;ctx.beginPath();
 if(scared){ctx.fillStyle="#5a2d22";ctx.beginPath();ctx.ellipse(0,-10,4,5+Math.sin(t*20)*1.5,0,0,7);ctx.fill()}
 else if(mode==="laugh"||mode==="sing"||mode==="dance"){ctx.arc(0,-13,5,.1,Math.PI-.1);ctx.stroke()}
 else if(mode==="sleep"){ctx.moveTo(-3,-10);ctx.lineTo(3,-10);ctx.stroke()}
 else{ctx.arc(0,-13,5,.15,Math.PI-.15);ctx.stroke()}
 ctx.restore();
 label(p.name,x,yy-49,12,"#443126");
 const em=p.emo||(mode==="shock"?"⚡":mode==="run"?"🏃":mode==="panic"?"😱":mode==="carry"?"💪":IDLE_TXT[mode]);
 if(em&&mode!=="walk")label(em,x+24,yy-33,16);
 if(mode==="panic"||mode==="run"){label("💦",x-26,yy-26+Math.sin(t*10)*3,13)}
}


// New recurring arrivals and 14-minute location tour.
let cloneCycle=0, planeCycle=0, locationCycle=0, cloneEvent=null, planeEvent=null;
let sceneLocation="default", goodVisitors=[], hostileVisitors=[];
function updateBigEvents(t,dt){
 const c=Math.floor(t/180);
 if(c>cloneCycle){cloneCycle=c;cloneEvent={age:0,x:rnd(130,770),done:false};$("caption").textContent="🧬 A clone machine drops from the sky!";}
 if(cloneEvent){cloneEvent.age+=dt;if(cloneEvent.age>2.1&&!cloneEvent.done){cloneEvent.done=true;const x=cloneEvent.x;let p=pickAlive();if(p){p.tx=x;p.ty=370;p.act="run";p.timer=2;}for(let i=0;i<3;i++)addPerson("Clone "+(people.length+1),x-35+i*35,390);parts.push({type:"txt",s:"🧬 ONE IN, THREE OUT!",size:20,x,y:260,vy:-8,life:3,max:3});}if(cloneEvent.age>6)cloneEvent=null;}
 const pc=Math.floor(t/240);
 if(pc>planeCycle){planeCycle=pc;planeEvent={age:0,done:false,x:rnd(240,660)};$ ("caption").textContent="✈️ A plane drops two people!";}
 if(planeEvent){planeEvent.age+=dt;if(planeEvent.age>2.5&&!planeEvent.done){planeEvent.done=true;for(let i=0;i<2;i++){const good=Math.random()<.4;const p=addPerson((good?"Friendly ":"Hostile ")+(people.length+1),planeEvent.x+(i?55:-55),385,true);p.visitorType=good?"good":"hostile";p.emo=good?"💚":"😈";if(good){p.breedClock=8;goodVisitors.push(p)}else hostileVisitors.push(p);}parts.push({type:"txt",s:"40% GOOD · 60% HOSTILE",size:17,x:450,y:245,vy:-7,life:3,max:3});}
  if(planeEvent.age>6)planeEvent=null;}
 // Friendly arrivals reproduce; each hostile arrival targets two villagers once.
 goodVisitors=goodVisitors.filter(p=>people.includes(p));
 goodVisitors.forEach(p=>{if(!p.dead&&!p.bredOut){p.breedClock=(p.breedClock||8)-dt;if(p.breedClock<=0){p.bredOut=true;for(let i=0;i<2;i++)addPerson("Newborn "+(people.length+1),p.x+rnd(-30,30),p.y);parts.push({type:"txt",s:"💚 They had children!",size:16,x:p.x,y:p.y-80,vy:-8,life:2.5,max:2.5});}}});
 hostileVisitors=hostileVisitors.filter(p=>people.includes(p));
 hostileVisitors.forEach(p=>{if(!p.dead&&!p.attackedTwice&&t>(p.hostileNext||0)){p.hostileNext=t+999999;p.attackedTwice=true;const victims=alive().filter(v=>v!==p).sort(()=>Math.random()-.5).slice(0,2);victims.forEach(v=>{parts.push({type:"txt",s:"⚔️",size:24,x:v.x,y:v.y-30,vy:-10,life:1.2,max:1.2});kill(v)});p.emo="🗡️";}});
 const lc=Math.floor(t/840);
 if(lc!==locationCycle){locationCycle=lc;sceneLocation=lc%6===0?"default":["desert","airport","waste","sky","cave"][((lc-1)%5)];const labels={default:"🏞️ Back to the default village",desert:"🏜️ The tribe has reached the desert",airport:"🛫 An airport appears",waste:"☢️ Wasted land",sky:"☁️ Above the sky",cave:"🔥 A cave with fire"};$("caption").textContent=labels[sceneLocation]||labels.default;}
}
function drawAltLocation(){
 if(sceneLocation==="default")return;
 const skies={desert:["#f7d18a","#d99b57"],airport:["#9bc7e8","#dfeaf1"],waste:["#6d7470","#a6a18c"],sky:["#367bc1","#c1e7ff"],cave:["#251e29","#624332"]};
 const c=skies[sceneLocation];const g=ctx.createLinearGradient(0,0,0,560);g.addColorStop(0,c[0]);g.addColorStop(1,c[1]);ctx.fillStyle=g;ctx.fillRect(0,0,900,560);
 if(sceneLocation==="desert"){ctx.fillStyle="#d4a35f";ctx.beginPath();ctx.moveTo(0,330);ctx.quadraticCurveTo(200,230,390,340);ctx.quadraticCurveTo(650,220,900,320);ctx.lineTo(900,560);ctx.lineTo(0,560);ctx.fill();for(let i=0;i<5;i++)bigEmoji("🌵",70+i*190,405+(i%2)*20,45);bigEmoji("☀️",760,80,55);}
 if(sceneLocation==="airport"){ctx.fillStyle="#777f87";ctx.fillRect(0,370,900,190);ctx.fillStyle="#f4f0d8";for(let x=0;x<900;x+=100)ctx.fillRect(x,455,50,5);ctx.fillStyle="#d5dce0";ctx.fillRect(80,190,740,110);ctx.fillStyle="#9ac8dc";for(let x=110;x<800;x+=65)ctx.fillRect(x,210,45,38);bigEmoji("✈️",470,150,75);label("TINY TRIBE INTERNATIONAL",450,180,15);}
 if(sceneLocation==="waste"){ctx.fillStyle="#77766b";ctx.fillRect(0,350,900,210);for(let i=0;i<9;i++){ctx.fillStyle=i%2?"#494d4a":"#99917b";ctx.fillRect(i*112,310+(i%3)*20,65,90);bigEmoji("☢️",i*112+32,335+(i%3)*20,23);}bigEmoji("🏚️",450,290,80);}
 if(sceneLocation==="sky"){ctx.fillStyle="#d9f3ff";for(let i=0;i<8;i++)cloud(i*130-30,160+(i%3)*85,.9,"#fff");bigEmoji("☁️",150,340,90);bigEmoji("☁️",730,330,100);label("ABOVE THE CLOUDS",450,80,22,"#fff");}
 if(sceneLocation==="cave"){ctx.fillStyle="#32232b";ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(900,0);ctx.lineTo(900,230);ctx.quadraticCurveTo(450,80,0,230);ctx.fill();ctx.fillStyle="#211a20";ctx.fillRect(0,430,900,130);bigEmoji("🔥",450,430,75);bigEmoji("🔥",350,450,38);bigEmoji("🔥",550,450,42);}
 label(({desert:"DESERT",airport:"AIRPORT",waste:"WASTED LAND",sky:"ABOVE THE SKY",cave:"FIRE CAVE"})[sceneLocation],450,35,22,sceneLocation==="cave"?"#ffd39a":"#fff");
}

function draw(ts){
 const t=ts/1000;
 const dt=Math.min(.05,(ts-(draw.last||ts))/1000);draw.last=ts;
 updateWorldCycles(t);

 ctx.save();ctx.clearRect(0,0,900,560);
 if(shake>0)ctx.translate(Math.sin(t*60)*5*shake,Math.cos(t*73)*4*shake);
 const wdark=weather==="thunder"?.55:weather==="rain"||weather==="flood"?.32:0;const dark=Math.max(wdark,extraDark);
 let sky=ctx.createLinearGradient(0,0,0,420);sky.addColorStop(0,"#9bd5d7");sky.addColorStop(1,"#e7e8b9");ctx.fillStyle=sky;ctx.fillRect(-10,-10,920,570);
 if(!wdark&&!nightMode)drawSun(t);
 if(nightMode){ctx.fillStyle="#182644";ctx.globalAlpha=.78;ctx.fillRect(-10,-10,920,570);ctx.globalAlpha=1;ctx.fillStyle="#f4f0d1";ctx.beginPath();ctx.arc(760,80,29,0,Math.PI*2);ctx.fill();for(let i=0;i<35;i++){const sx=(i*137+31)%900,sy=(i*71+17)%260;ctx.fillStyle="rgba(255,255,220,.8)";ctx.fillRect(sx,sy,2,2);}}
 cloud(110+Math.sin(t*.1)*12,78,.8);cloud(430,115,.55);
 ctx.fillStyle="#a7c89a";ctx.beginPath();ctx.moveTo(0,310);ctx.quadraticCurveTo(150,190,300,310);ctx.quadraticCurveTo(510,180,680,300);ctx.quadraticCurveTo(790,240,900,300);ctx.lineTo(900,560);ctx.lineTo(0,560);ctx.fill();
 if(worldVillage==="forest"){
  // Dense forest village with a stepped stone pyramid, while all villagers/events continue.
  ctx.fillStyle="#416a4b";ctx.beginPath();ctx.moveTo(0,310);ctx.quadraticCurveTo(150,190,300,310);ctx.quadraticCurveTo(510,180,680,300);ctx.quadraticCurveTo(790,240,900,300);ctx.lineTo(900,560);ctx.lineTo(0,560);ctx.fill();
  for(let i=0;i<13;i++){const x=(i*83+25)%930;tree(x,350+(i%3)*22,.75+(i%4)*.12)}
  ctx.fillStyle="#d8c18a";ctx.beginPath();ctx.moveTo(0,390);ctx.quadraticCurveTo(300,360,470,390);ctx.quadraticCurveTo(690,370,900,390);ctx.lineTo(900,560);ctx.lineTo(0,560);ctx.fill();
  // stepped jungle pyramid
  ctx.fillStyle="#827b69";ctx.beginPath();ctx.moveTo(320,365);ctx.lineTo(360,320);ctx.lineTo(390,320);ctx.lineTo(410,285);ctx.lineTo(440,285);ctx.lineTo(460,250);ctx.lineTo(490,285);ctx.lineTo(520,285);ctx.lineTo(540,320);ctx.lineTo(570,320);ctx.lineTo(610,365);ctx.closePath();ctx.fill();
  ctx.fillStyle="#a69b80";for(let i=0;i<4;i++){ctx.fillRect(365-i*15,330-i*27,200+i*30,8)}
  ctx.fillStyle="#493b32";ctx.fillRect(445,330,38,35);label("JUNGLE PYRAMID",465,238,12,"#fff1cf");
 }else{
  // riverside village
  ctx.fillStyle="#8e745c";ctx.beginPath();ctx.moveTo(0,255);ctx.lineTo(0,130);ctx.quadraticCurveTo(65,30,160,120);ctx.lineTo(195,255);ctx.closePath();ctx.fill();
  ctx.fillStyle="#493b32";ctx.beginPath();ctx.moveTo(20,255);ctx.lineTo(22,170);ctx.quadraticCurveTo(68,95,124,170);ctx.lineTo(143,255);ctx.closePath();ctx.fill();
  ctx.fillStyle="#77c9d0";ctx.beginPath();ctx.moveTo(0,435);ctx.quadraticCurveTo(170,395,310,440);ctx.quadraticCurveTo(500,480,660,428);ctx.quadraticCurveTo(790,398,900,430);ctx.lineTo(900,560);ctx.lineTo(0,560);ctx.fill();
  ctx.strokeStyle="#c4f0e7";ctx.lineWidth=3;for(let i=0;i<6;i++){let x=((t*35+i*177)%950)-25,y=458+i*16;ctx.beginPath();ctx.moveTo(x,y);ctx.quadraticCurveTo(x+20,y-4,x+44,y);ctx.stroke()}
  ctx.fillStyle="#d8c18a";ctx.beginPath();ctx.moveTo(0,360);ctx.quadraticCurveTo(300,330,470,365);ctx.quadraticCurveTo(690,340,900,360);ctx.lineTo(900,450);ctx.lineTo(0,450);ctx.fill();
  tree(845,350,1);tree(195,350,.65);
  ctx.fillStyle="#a77b4c";ctx.beginPath();ctx.roundRect(335,265,150,88,7);ctx.fill();
  ctx.fillStyle="#c18b55";ctx.beginPath();ctx.moveTo(315,275);ctx.lineTo(410,205);ctx.lineTo(505,275);ctx.closePath();ctx.fill();
 }
 drawAltLocation();
 const inside=people.filter(p=>p.inside).length;
 ctx.fillStyle=inside?"#ffd45d":"#65402e";ctx.fillRect(390,306,38,47);
 label("HOME",410,292,10,"#fff1cf");
 if(inside)label("👀 ×"+inside,410,300+22,0.1);
 // people (sorted by y)
 const vis=people.filter(p=>!p.inside&&!p.dead).sort((a,b)=>a.y-b.y);
 vis.forEach(p=>{
  if(p.carriedBy)return;
  drawPerson(p,t,p.x,p.y,p.act);
  if(p.carry){drawPerson(p.carry,t,p.x,p.y-54,"panic")}
 });
 // flood water
 if(flood>.01){
  const top=470-flood*150;
  ctx.fillStyle="rgba(60,150,185,.55)";ctx.beginPath();ctx.moveTo(0,560);ctx.lineTo(0,top);
  for(let x=0;x<=900;x+=30)ctx.lineTo(x,top+Math.sin(x*.03+t*3)*5);
  ctx.lineTo(900,560);ctx.closePath();ctx.fill();
  ctx.strokeStyle="#d7f4f0";ctx.lineWidth=2;ctx.beginPath();for(let x=0;x<=900;x+=30){const y=top+Math.sin(x*.03+t*3)*5;x?ctx.lineTo(x,y):ctx.moveTo(x,y)}ctx.stroke();
 }
 drawScenes(t);
 if(cloneEvent){const a=cloneEvent.age,x=cloneEvent.x,y=Math.min(330,a*150);bigEmoji("🧬",x,y,60);ctx.fillStyle="#626a70";ctx.fillRect(x-42,y+20,84,64);ctx.fillStyle="#9cf4e5";ctx.fillRect(x-26,y+32,52,28);label("CLONE MACHINE",x,y+100,12);if(a>1.4)label("ENTER → ×3",x,y+120,13);}
 if(planeEvent){const a=planeEvent.age,x=planeEvent.x;bigEmoji("✈️",a<2.5?900-a*220:x,65+a*12,65);if(a>1.4&&a<3.5){bigEmoji("🪂",x-35,180+(a-1.4)*60,28);bigEmoji("🪂",x+35,180+(a-1.4)*60,28);}if(a>2.5)label("💚 / 😈",x,280,22);}
 if(flyerActive)drawFlyingMan(t);
 // darkness / rain
 if(dark){ctx.fillStyle="rgba(30,35,60,"+dark+")";ctx.fillRect(-10,-10,920,570);cloud(200,60,1.2,"#6b7080");cloud(520,50,1.4,"#5d6272");cloud(760,70,1.1,"#6b7080")}
 if(weather==="rain"||weather==="thunder"||weather==="flood"){
  ctx.strokeStyle="rgba(200,230,255,.7)";ctx.lineWidth=1.5;ctx.beginPath();
  drops.forEach(d=>{ctx.moveTo(d.x,d.y);ctx.lineTo(d.x-4,d.y+12)});ctx.stroke();
 }
 bolts.forEach(b=>{ctx.strokeStyle="#fffbd0";ctx.lineWidth=4;ctx.shadowColor="#fff";ctx.shadowBlur=18;ctx.beginPath();b.pts.forEach((q,i)=>i?ctx.lineTo(q[0],q[1]):ctx.moveTo(q[0],q[1]));ctx.stroke();ctx.shadowBlur=0});
 if(flash>0){ctx.fillStyle="rgba(255,255,230,"+flash*.7+")";ctx.fillRect(-10,-10,920,570)}
 ctx.restore();
 requestAnimationFrame(draw);
}
